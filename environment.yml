name: base
channels:
  - defaults
dependencies:
  - _anaconda_depends
  - python=3.13
  - setuptools
  - pip
  - wheel
  - anaconda-anon-usage
  - anaconda-catalogs
  - anaconda-client
  - anaconda-project
  - anaconda-navigator
  - conda
  - conda-anaconda-telemetry
  - conda-anaconda-tos[version='>=0.2.0']
  - conda-build
  - conda-content-trust
  - conda-libmamba-solver
  - conda-pack
  - conda-package-handling
  - conda-package-streaming
  - anaconda-auth
  - anaconda_prompt
  - anaconda_powershell_prompt
  - ipykernel
  - menuinst
  - jax
  - stumpy
  - opencv
  - tensorflow
  - torchvision
  - python-docx
  # Dev tooling. Added 2026-08-31 with explicit sign-off (see CLAUDE.md >
  # Environment): pytest-xdist for `pytest -n auto`; playwright for the web
  # UI's browser gate `webui/smoke.py` (the Panel-era `pytest -m ui` suite that
  # first brought pytest-playwright in was retired 2026-09-21, tag
  # archive/panel-ui — the runtime it depended on is what smoke.py still uses).
  # Nothing the application imports depends on these, and the headless suite
  # must keep passing without them.
  #
  # After creating the environment, also run once per machine:
  #     python -m playwright install chromium
  - pip:
      - pytest-xdist
      - playwright
prefix: C:\ProgramData\anaconda3
